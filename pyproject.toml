[project]
name = "ai-buddy-dev"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.23,<5",
  "pyyaml>=6,<7",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "pglast>=7,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "ai-service/tests", "mock-services/tests"]
pythonpath = [".", "ai-service", "mock-services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
omit = ["*/tests/*", "ai-service/app/main.py", "mock-services/corporate/main.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 82

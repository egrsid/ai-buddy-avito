name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mvp_acceptance:
        description: Run target AI ingest/DB acceptance after component delivery
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.4'}
      - run: make check
  python:
    runs-on: ubuntu-latest
    services:
      test-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_admin
          POSTGRES_DB: buddy_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d buddy_test_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test_admin@127.0.0.1:5432/buddy_test_ci
      TEST_APP_PASSWORD: test_app
      TEST_MOCK_PASSWORD: test_mock
      MOCK_TEST_DSN: postgresql://mock_service:test_mock@127.0.0.1:5432/buddy_test_ci
      MOCK_TEST_ADMIN_DSN: postgresql://postgres:test_admin@127.0.0.1:5432/buddy_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.4'}
      - run: uv sync --frozen
      - run: uv run --frozen python -m scripts.check_components ai
      - run: uv run --frozen python -m scripts.backend_test_db
      - run: uv run --frozen python -m scripts.check_components mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: |
            ai-service/coverage/
            mock-services/coverage/
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
        working-directory: frontend
      - run: python -m scripts.check_components frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-coverage, path: frontend/coverage/, if-no-files-found: ignore}
  backend:
    runs-on: ubuntu-latest
    services:
      test-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_admin
          POSTGRES_DB: buddy_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d buddy_test_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test_admin@127.0.0.1:5432/buddy_test_ci
      TEST_APP_PASSWORD: test_app
      TEST_MOCK_PASSWORD: test_mock
      MOCK_TEST_DSN: postgresql://mock_service:test_mock@127.0.0.1:5432/buddy_test_ci
      MOCK_TEST_ADMIN_DSN: postgresql://postgres:test_admin@127.0.0.1:5432/buddy_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod, cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.4'}
      - run: uv sync --frozen
      - run: uv run --frozen python -m scripts.backend_test_db
      - run: uv run --frozen python -m scripts.check_components backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: go-coverage, path: backend/coverage.coverprofile, if-no-files-found: ignore}
  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ai-buddy-demo-ci
      COMPOSE_FILE: compose.yaml:compose.mvp.yaml:compose.demo.yaml
      APP_ORIGIN: http://localhost:15173
      BACKEND_PORT: '18080'
      FRONTEND_PORT: '15173'
      SEED_DATASET: v2
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: python3 -m scripts.demo up --project ai-buddy-demo-ci
      - name: Validate v2 schemas in the unprivileged image
        run: docker compose -f compose.yaml -f compose.mvp.yaml --profile acceptance run --build --rm --no-deps contract-image-tests
      - run: |
          make migrate seed
          make migrate seed
          make verify-db smoke
      - run: python3 -m scripts.demo ai-db-test --project ai-buddy-demo-ci
      - run: python3 -m scripts.demo api-test --project ai-buddy-demo-ci
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  mvp-ai-db:
    if: github.event_name == 'workflow_dispatch' && inputs.mvp_acceptance
    runs-on: ubuntu-latest
    env:
      AI_INGEST_COMMAND: '["python","-m","app.ingest"]'
      AI_DB_TEST_COMMAND: '["python","-m","pytest","ai-service/tests/test_kb_integration.py","-q"]'
      LLM_MODE: mock
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.4'}
      - run: cp .env.example .env
      - run: make mvp-up
      - run: make ai-db-test
      - if: always()
        run: docker compose -f compose.yaml -f compose.mvp.yaml down --volumes
